[package]
description = "xBNC IRC bouncer daemon and administration CLI"
name = "xbncd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
tar = { version = "0.4", default-features = false }
flate2 = "1"
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1.12.1"
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
blowfish = "0.9"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ring = "0.17.14"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
postgres = { version = "0.19.14", default-features = false }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["codec", "io"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# portable-dispatch: the interpreter loop never grows the native stack, even
# when the optimizer does not turn its handlers into tail calls (found by
# fuzzing an instrumented build). Plugins run a little slower; safety first.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch"] }
xbnc-proto = { version = "1.0.0", path = "../xbnc-proto" }

[dev-dependencies]
tokio-tungstenite = "0.29.0"
http-body-util = "0.1.5"
tempfile = "3.27.0"
wat = "1"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
