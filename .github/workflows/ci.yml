name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XBNC_TEST_POSTGRES: postgres://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xbncd --locked --test api --test e2e --test modules --test plugins --test official_plugins --test panel --test sso --test postgres

  test-arm64:
    name: Build and test on ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
      - run: cargo build --release --locked && ./packaging/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/*.deb

  web:
    name: Web panel (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run i18n:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Committed web/dist matches the sources
        run: git diff --exit-code -- web/dist || (echo "Run 'npm run build' in web/ and commit web/dist" && exit 1)

  plugins:
    name: Plugin SDKs build to WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: C examples
        run: make -C sdk/c clean all
      - name: Rust example
        run: cargo build -p xbnc-plugin --release --target wasm32-unknown-unknown --example stats
      - name: Pack and check every plugin
        run: |
          cargo build -p xbncd
          ./target/debug/xbncd plugin pack target/wasm32-unknown-unknown/release/examples/stats.wasm \
            sdk/rust/examples/stats.json -o /tmp/stats.wasm
          for p in /tmp/stats.wasm sdk/c/examples/*.wasm; do ./target/debug/xbncd plugin check "$p"; done

  real-ircd:
    name: Against a real IRC server (${{ matrix.ircd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ircd: ergo
            image: ghcr.io/ergochat/ergo:stable
          - ircd: inspircd
            image: inspircd/inspircd-docker:latest
    services:
      ircd:
        image: ${{ matrix.image }}
        ports:
          - 6667:6667
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for the server
        run: for i in $(seq 30); do nc -z 127.0.0.1 6667 && break; sleep 2; done
      - run: cargo test -p xbncd --test real_ircd -- --ignored --nocapture
        env:
          XBNC_IRCD: 127.0.0.1:6667

  real-ircd-built:
    name: Against a real IRC server (${{ matrix.ircd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ircd: [unrealircd, solanum]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update >/dev/null
      - run: ./testenv/ci/start-ircd.sh ${{ matrix.ircd }}
      - run: cargo test -p xbncd --test real_ircd -- --ignored --nocapture
        env:
          XBNC_IRCD: 127.0.0.1:6667

  real-ircd-miniircd:
    name: Against a real IRC server (miniircd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install miniircd && (miniircd --ports 6667 --listen 127.0.0.1 &) && sleep 2
      - run: cargo test -p xbncd --test real_ircd -- --ignored --nocapture
        env:
          XBNC_IRCD: 127.0.0.1:6667

  packages:
    name: DEB and RPM packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: ./packaging/build-packages.sh
      - name: RPM (Fedora container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest \
            sh -c 'dnf install -y rpm-build >/dev/null && ./packaging/build-packages.sh'
      - name: Install the .deb in a clean Debian container
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:stable-slim sh -c \
            'apt-get update >/dev/null && apt-get install -y /dist/xbnc_*.deb >/dev/null && xbncd --version'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  msrv:
    name: Minimum supported Rust version (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --all --locked

  deps:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh testenv/setup.sh docker/entrypoint.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xbnc:ci .
      - name: Smoke test
        run: |
          docker run -d --name xbnc -e XBNC_INSECURE=1 -p 6667:6667 -p 8080:8080 xbnc:ci
          sleep 3
          docker logs xbnc 2>&1 | grep -q "setup code"
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<!doctype html"
          docker exec -e XBNC_PASSWORD=ci-password-123 xbnc xbncd user add ci --admin
          docker exec xbnc xbncd user list | grep -q '^ci '
