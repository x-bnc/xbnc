# Publishes a release when started by hand (Actions tab), for a tag vX.Y.Z:
#   - DEB and RPM packages signed with the release key (+ .sig, SHA256SUMS)
#   - a GitHub release with those files (what the panel's update check reads)
#   - the Docker image on ghcr.io/<owner>/xbnc:<version> and :latest
#
# Needs, in Settings > Secrets and variables > Actions:
#   XBNC_RELEASE_KEY         private key from `xbncd release keygen` (secret)
#   XBNC_RELEASE_PUBLIC_KEY  its public key (variable; used to verify)
#   GPG_PRIVATE_KEY, GPG_KEY_ID  optional, to also GPG-sign the packages
name: Release

# Builds and signs .deb and .rpm packages and container images. During the
# beta xBNC is published only as a .zip,
# so this workflow only runs when started by hand from the Actions tab.
# To build packages on every tag again, add:
#   push:
#     tags: ["v*.*.*"]
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  packages:
    # Native runners for both architectures (no cross-compiling).
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_GPG: ${{ secrets.GPG_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - run: cargo test --all --locked
      - run: cargo build --release --locked
      - run: ./packaging/build-packages.sh
      - name: RPM (Fedora container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest \
            sh -c 'dnf install -y rpm-build >/dev/null && ARCH=${{ matrix.arch }} ./packaging/build-packages.sh'
      - name: Import the GPG key
        if: env.HAS_GPG == 'true'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          sudo apt-get install -y dpkg-sig rpm >/dev/null
      - name: Sign
        env:
          XBNC_RELEASE_KEY: ${{ secrets.XBNC_RELEASE_KEY }}
          XBNC_RELEASE_PUBLIC_KEY: ${{ vars.XBNC_RELEASE_PUBLIC_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: ./packaging/sign-packages.sh
      - name: Install the signed .deb in a clean Debian container
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:stable-slim sh -c \
            'apt-get update >/dev/null && apt-get install -y /dist/xbnc_*.deb >/dev/null && xbncd --version'
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: notes
          path: notes.md

  publish:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: One checksum file for every package
        run: |
          cd dist && rm -f SHA256SUMS && sha256sum xbnc_* xbnc-* > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" $(ls dist/* | grep -v notes.md) --title "xBNC ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z)/xbnc" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=xBNC
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.authors=y2k
