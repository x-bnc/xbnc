/* Minimal UnrealIRCd 6 configuration for xBNC's CI (local only). */
include "modules.default.conf";
include "operclass.default.conf";

me { name "unreal.test"; info "xBNC CI"; sid "001"; }
admin { "xBNC CI"; }

class clients { pingfreq 90; maxclients 1000; sendq 200k; recvq 8000; }
allow { mask *; class clients; maxperip 1000; }

listen { ip 127.0.0.1; port 6667; }

log {
    source { !debug; all; }
    destination { file "ircd.log" { maxsize 10M; } }
}

set {
    network-name "xBNC-CI";
    default-server "unreal.test";
    services-server "services.test";
    help-channel "#xbnc";
    hiddenhost-prefix "ci";
    /* Test-only keys: never reuse them on a real network. */
    cloak-keys {
        "jnV4nMDSJHUi09JoTgbq4oDLR348rXHcatAxEQSnoDhNdLUdfloosZqx1799XlmzxppVB5QPl0XiZOPu";
        "ewPwZ0Ty9iGkyPW1tdo0403um1AjQlh7MOAftj1hvFAI3I1WNLWKR8RkLswKDbrUL1oyLZX7GPAcTeU0";
        "o5DJYPMGhD3m1Mwbory13rU8Sj8mS97STmdUW3XHDyABTsQPd5ZfdREOgO96EG0MpYT34vWXfNCh2fda";
    }
    plaintext-policy { user allow; }
    handshake-delay 0;
    anti-flood { everyone { connect-flood 1000:1; } }
    connthrottle { new-users { local-throttle 1000:1; global-throttle 1000:1; } }
}
