/* Minimal Solanum configuration for xBNC's CI (local only). */
serverinfo {
    name = "solanum.test";
    sid = "1SO";
    description = "xBNC CI";
    network_name = "xBNC-CI";
};
admin { name = "xBNC CI"; email = "ci@localhost"; };
class "users" {
    ping_time = 2 minutes;
    number_per_ident = 1000;
    number_per_ip = 1000;
    number_per_ip_global = 1000;
    max_number = 1000;
    sendq = 400 kbytes;
};
listen { host = "127.0.0.1"; port = 6667; };
auth { user = "*@*"; class = "users"; flags = no_tilde, exceed_limit; };
general {
    disable_auth = yes;
    throttle_count = 1000;
    throttle_duration = 1;
    anti_spam_exit_message_time = 0;
    default_floodcount = 1000;
    client_flood_max_lines = 1000;
};
channel { autochanmodes = "+nt"; };
